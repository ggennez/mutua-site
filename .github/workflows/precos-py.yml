name: Coleta de preços (Compras Paraguai)

on:
  schedule:
    # 3x ao dia — 08h, 14h e 20h no horário de Brasília (UTC-3)
    - cron: '0 11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precos-py
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/precos-py/*.test.mjs
      - run: node scripts/precos-py/coletar.mjs
      - name: Commit do histórico
        run: |
          git config user.name "precos-bot"
          git config user.email "precos-bot@users.noreply.github.com"
          git add public/data/precos-py/historico.json
          git diff --cached --quiet || git commit -m "dados: coleta de preços $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
